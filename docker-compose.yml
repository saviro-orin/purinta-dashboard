services:
  web:
    build: .
    restart: unless-stopped
    environment:
      PORT: "4300"
      SQLITE_PATH: /app/data/purinta-dashboard.sqlite3
      PURINTA_POLL_INTERVAL_MS: ${PURINTA_POLL_INTERVAL_MS:-30000}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-https://eth.drpc.org}
      ETHEREUM_RPC_FALLBACK_URL: ${ETHEREUM_RPC_FALLBACK_URL:-https://eth-mainnet.public.blastapi.io}
      MORPHO_GRAPHQL_URL: ${MORPHO_GRAPHQL_URL:-https://blue-api.morpho.org/graphql}
      PURINTA_INDEXER_ENABLED: ${PURINTA_INDEXER_ENABLED:-true}
      PURINTA_INDEXER_INTERVAL_MS: ${PURINTA_INDEXER_INTERVAL_MS:-60000}
      PURINTA_INDEXER_DELAY_MS: ${PURINTA_INDEXER_DELAY_MS:-250}
      PURINTA_INDEXER_BATCH_BLOCKS: ${PURINTA_INDEXER_BATCH_BLOCKS:-25}
      PURINTA_INDEXER_MAX_BLOCKS_PER_RUN: ${PURINTA_INDEXER_MAX_BLOCKS_PER_RUN:-2000}
      PURINTA_INDEXER_BLOCK_LAG: ${PURINTA_INDEXER_BLOCK_LAG:-8}
      PURINTA_INDEXER_NORMAL_LAG_BLOCKS: ${PURINTA_INDEXER_NORMAL_LAG_BLOCKS:-12}
      PURINTA_INDEXER_START_BLOCK: ${PURINTA_INDEXER_START_BLOCK:-25149499}
    ports:
      - "4300:4300"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun -e \"const r = await fetch('http://127.0.0.1:4300/health'); if (!r.ok) process.exit(1);\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
