version: 2
updates:
  # JavaScript / Bun dependencies at the repo root.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  # Optional Envio HyperIndex sidecar dependencies.
  - package-ecosystem: npm
    directory: "/indexer"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      indexer-npm-minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      github-actions:
        update-types:
          - minor
          - patch
